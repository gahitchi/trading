# trading-lab configuration. Every run records a copy of the settings it used.

[paths]
data = "data"          # one validated Parquet file per ticker + manifest.json
results = "results"    # backtest outputs, holdout ledger, paper-trading journal
research = "research"  # the research swarm's blackboard: one folder per hypothesis

# Ticker = primary listing venue (ISO 10383 MIC code).
# Backtests trade every ticker through one simulated broker account; paper trading
# uses these venues to match Interactive Brokers instruments.
# XNAS = Nasdaq, XNYS = New York Stock Exchange, ARCX = NYSE Arca (most ETFs)
[universe]
SPY = "ARCX"
QQQ = "XNAS"
AAPL = "XNAS"
MSFT = "XNAS"
JPM = "XNYS"
XOM = "XNYS"
JNJ = "XNYS"
KO = "XNYS"

[periods]
warmup_start = "2009-01-01"         # history used only to warm up indicators, never traded
train = ["2010-01-01", "2018-12-31"]  # develop and optimize here
test = ["2019-01-01", "2022-12-31"]   # check what survived training
holdout = ["2023-01-01", ""]          # "" = up to the latest data. One run per hypothesis, logged.

[backtest]
capital = 100000.0
commission_per_share = 0.005  # IBKR Pro Fixed pricing
commission_min = 1.0          # per order
commission_max_pct = 0.01     # cap: 1% of trade value
slippage = true               # every fill one tick against you
open_print_fraction = 0.01    # liquidity at the opening print, as a fraction of daily volume
min_trade_value = 500.0       # never send an order smaller than this
rebalance_band = 0.02         # resize a held position only if the change exceeds 2% of equity
cash_buffer = 0.01            # size buys on 99% of equity: next-open fills can gap above the close

[risk]
# Set profile to calm|cautious|balanced|dynamic|aggressive for adaptive risk units.
# 'custom' preserves the existing operating limits until the user opts into a preset.
# Profiles cannot exceed the hard limits below; dynamic/aggressive shorts need operator
# short caps > 0, gross > 1, broker permissions and confirmed borrow availability.
profile = "custom"
# Fractions of equity. Weights are signed (negative = short). These defaults are long-only, unlevered.
max_weight = 0.25       # max |weight| of one stock
max_gross = 1.0         # max sum of |weights|; above 1 is leverage (capped by [margin] initial: 2.0 at Reg T)
max_short_gross = 0.0   # max sum of short |weights|; 0 forbids shorting
min_net = 0.0           # net exposure (longs - shorts) must stay within [min_net, max_net]
max_net = 1.0
max_drawdown = 0.35     # circuit breaker: flatten and halt if equity drops 35% from its peak

[margin]
# Requirements as fractions of position value: Reg T / FINRA minimums. IBKR's house rules can be stricter.
initial_long = 0.50
initial_short = 0.50
maintenance_long = 0.25
maintenance_short = 0.30
cushion = 0.10          # deleverage once equity is within 10% of the maintenance requirement
# Financing, charged daily in the ledger. ASSUMPTIONS where no point-in-time data exists; every run reports them.
borrow_apr = 0.005      # stock-borrow fee for easy-to-borrow names; hard-to-borrow stocks cost far more
debit_apr = 0.06        # interest on borrowed cash (IBKR: benchmark rate + spread). Set the current rate.

[portfolio]
target_vol = 0.0        # annualized volatility target (e.g. 0.15); 0 = off
vol_window = 63         # trading days used to estimate volatility
max_leverage = 1.0      # ceiling on the volatility-targeting scale: 1 scales down only, 1.5 may lever up to 1.5x
leverage = 1.0          # fixed exposure multiplier when target_vol = 0

[paper]
host = "127.0.0.1"
port = 4002              # IB Gateway paper port (TWS paper: 7497). Live ports are refused.
client_id = 7
account_id = ""          # your IB paper account ID; paper accounts start with "DU"
market_data = "DELAYED_FROZEN"  # REALTIME needs IB market data subscriptions
capital = 100000.0       # how much of the paper account the agents may allocate
rebalance_time = "16:15" # New York time; orders go out as market-on-open for the next session
signal_time = "16:10"    # New York time; agents fetch the completed daily bars
max_order_value = 30000.0   # fat-finger guard: no single buy above this (USD)
max_orders_per_day = 40
max_daily_turnover = 1.0    # buys per day, as a fraction of equity
order_rate = "10/00:00:01"  # NautilusTrader risk engine: at most 10 order submissions per second
# Environment variables override these (used by the Docker deployment):
#   LAB_IB_HOST, LAB_IB_PORT, LAB_IB_CLIENT_ID, LAB_PAPER_ACCOUNT

[research]
provider = "claude_code"   # "claude_code" (your Claude subscription) or "ollama" (local, free)
model = "sonnet"           # claude_code: haiku | sonnet | opus.  ollama: e.g. "qwen2.5-coder:7b"
ollama_url = "http://127.0.0.1:11434"
call_timeout_s = 600
max_llm_calls_per_cycle = 10  # hard budget per research cycle
max_fix_attempts = 3          # engineer retries when generated code fails checks
null_samples = 30             # bootstrap resamples of real data for the noise-floor test
min_sharpe_edge = 0.10        # train Sharpe must beat buy-and-hold by at least this
max_p_value = 0.05            # and beat at least 95% of the noise-floor samples
min_dsr = 0.95                # and its active return's Deflated Sharpe Ratio (all trials counted) >= this
