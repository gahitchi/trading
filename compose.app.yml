# Guided local UI. Start with tools/start_app.py; it never starts trading itself.
name: trading-lab-app
services:
  ib-gateway:
    extends:
      file: docker-compose.yml
      service: ib-gateway
  lab:
    extends:
      file: docker-compose.yml
      service: lab
    command: app --directory /lab/results/app-workspace --host 0.0.0.0 --no-browser
    stop_grace_period: 30s
    user: "${LAB_APP_UID:-1000}:${LAB_APP_GID:-1000}"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
secrets:
  tws_password:
    file: ./secrets/tws_password
