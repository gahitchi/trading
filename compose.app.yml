# The graphical application runs before IBKR approval or any broker credentials.
# Do not add a Gateway dependency here: it would make offline setup impossible.
name: trading-lab-app
services:
  lab:
    build: .
    image: trading-lab:latest
    restart: unless-stopped
    command: app --directory /lab/results/app-workspace --host 0.0.0.0 --no-browser
    user: "${LAB_APP_UID:-1000}:${LAB_APP_GID:-1000}"
    environment:
      LAB_IB_HOST: ib-gateway
      LAB_IB_PORT: "4004"
      LAB_IB_CLIENT_ID: "7"
      TZ: America/New_York
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./results:/lab/results
      - ./research:/lab/research:ro
      - ./data:/lab/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
