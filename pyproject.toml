[project]
name = "trading-lab"
version = "0.2.0"
description = "Fast crypto trading lab on NautilusTrader: market-data recorder, microstructure research, paper trading"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.13,<3.15"  # nautilus_trader 2.0.0rc7 ships cp313/cp314 only
dependencies = [
    # Pinned exactly: 2.0 is in release candidates and its API still moves between RCs.
    "nautilus_trader==2.0.0rc7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",  # pytest -n auto
]

[dependency-groups]
build = ["hatchling==1.32.4"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import helpers as `from tests.conftest import ...`: make the repo root importable under plain `pytest`
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B008", "RUF012", "E501"]  # E501: ruff format owns line length
