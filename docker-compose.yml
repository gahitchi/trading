# trading-lab deployment: the crypto market-data recorder (public data only, no keys, no orders).
#
#   docker compose up -d recorder      docker compose logs -f recorder      docker compose ps (health)
#   docker compose run --rm recorder record --status

name: trading-lab

services:
  recorder:
    image: trading-lab:latest
    build: .
    restart: unless-stopped         # reconnects by restarting after a lost connection or exchange maintenance
    environment:
      TZ: UTC
    command: record --symbols ${LAB_RECORD_SYMBOLS:-BTCUSDT ETHUSDT SOLUSDT}
    volumes:
      - ./lab.toml:/lab/lab.toml:ro
      - ./data:/lab/data              # writes data/market/
    healthcheck:
      # Healthy while the heartbeat is fresh and every instrument has sent data in the last minute.
      test: ["CMD", "python", "-c", "import json, datetime as d; h = json.load(open('/lab/data/market/heartbeat.json')); age = (d.datetime.now(d.UTC) - d.datetime.fromisoformat(h['at'])).total_seconds(); raise SystemExit(0 if h['running'] and age < 120 and not h['stale'] else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
