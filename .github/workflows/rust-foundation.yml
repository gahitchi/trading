name: Rust foundation

on:
  push:
    branches:
      - 'chatgpt/rust-*'
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --locked --release
      - name: Offline paper CLI smoke and recovery
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- demo "$tmp/session.journal"
          cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- inspect "$tmp/session.journal"
          if cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- demo "$tmp/session.journal"; then
            echo "ERROR: duplicate journal was accepted" >&2
            exit 1
          fi
