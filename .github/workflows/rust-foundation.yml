name: Rust foundation

on:
  push:
    branches:
      - 'chatgpt/rust-*'
      - 'chatgpt/live-upgrade-*'
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: One-time lock and formatter
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/live-upgrade-market-data-20261027'
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git add Cargo.lock crates/
          if ! git diff --cached --quiet; then
            git config user.name 'ChatGPT Rust formatter'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Format zero-budget local protocol lab and lock dependencies" -m "Agent: chatgpt"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --locked --release
      - name: Offline paper CLI smoke and recovery
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- demo "$tmp/session.journal"
          cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- inspect "$tmp/session.journal"
          if cargo run --locked --release -p trading-paper-gateway --bin paper-lab -- demo "$tmp/session.journal"; then
            echo "ERROR: duplicate journal was accepted" >&2
            exit 1
          fi
