name: Rust foundation

on:
  push:
    branches:
      - 'chatgpt/rust-*'
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: One-time format imported Part 2
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/rust-engine-foundation-20261027'
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git add crates/ Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name 'ChatGPT Rust bootstrap'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Freeze Rust workspace lockfile and formatting" -m "Agent: chatgpt"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --release
