name: f1-account-state-evidence-isolated

# Offline exact account-state evidence only. This is NOT broker approval;
# the full Docker CVE and release gates remain deliberately unchanged.
on:
  push:
    branches:
      - chatgpt/f1-account-state-evidence-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-state-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - name: immutable journal, native fill and account-state evidence
        run: uv run --no-sync pytest -q tests/test_economic_ledger.py tests/test_economic_observation.py tests/test_economic_account_state.py
      - name: pinned F1 lint and format
        run: |
          uvx --from ruff==0.17.3 ruff check src/lab/economic_ledger.py src/lab/economic_observation.py src/lab/economic_account_state.py tests/test_economic_ledger.py tests/test_economic_observation.py tests/test_economic_account_state.py
          uvx --from ruff==0.17.3 ruff format --check src/lab/economic_ledger.py src/lab/economic_observation.py src/lab/economic_account_state.py tests/test_economic_ledger.py tests/test_economic_observation.py tests/test_economic_account_state.py
