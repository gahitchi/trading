name: One-time Ruff format for read-only account crosscheck
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-maintenance.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format account verification source and tests
        run: |
          uvx ruff format src/lab/paper_account_crosscheck.py src/lab/cli.py tests/test_paper_account_crosscheck.py tests/test_crash_oi_migration.py
          uvx ruff check src tests
          git diff --check
      - name: Commit mechanical formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lab/paper_account_crosscheck.py src/lab/cli.py tests/test_paper_account_crosscheck.py tests/test_crash_oi_migration.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format independent paper account crosscheck'
            git push origin HEAD:chatgpt/codex-maintenance
          fi
