name: One-time Ruff precision regression formatter
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-maintenance.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format focused Decimal arithmetic changes and tests
        run: |
          uvx ruff format src/lab/binance_demo_export.py tests/test_binance_demo_export.py
          uvx ruff check src tests
          git diff --check
      - name: Commit mechanical formatting to maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lab/binance_demo_export.py tests/test_binance_demo_export.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format demo Decimal precision regressions'
            git push origin HEAD:chatgpt/codex-maintenance
          fi
