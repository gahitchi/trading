name: One-time Ruff format for public market evidence
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-maintenance.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format only new public market code and tests
        run: |
          uvx ruff format src/lab/public_market_evidence.py src/lab/cli.py tests/test_public_market_evidence.py
          uvx ruff check src tests
          git diff --check
      - name: Commit mechanical changes to our branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lab/public_market_evidence.py src/lab/cli.py tests/test_public_market_evidence.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format public market evidence collector'
            git push origin HEAD:chatgpt/codex-maintenance
          fi
