name: One-time Ruff format on maintenance
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-maintenance.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format changed source and tests
        run: |
          uvx ruff format src/lab/sandbox_capture.py src/lab/fast.py src/lab/cli.py tests/test_sandbox_capture.py
          git diff --check
      - name: Commit style-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lab/sandbox_capture.py src/lab/fast.py src/lab/cli.py tests/test_sandbox_capture.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format sandbox capture integration'
            git push origin HEAD:chatgpt/codex-maintenance
          fi
