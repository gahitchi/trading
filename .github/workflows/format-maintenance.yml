name: One-time Ruff formatting (maintenance branch)
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-maintenance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Apply Ruff formatter without semantic edits
        run: |
          uvx ruff format src tests
          git diff --check
      - name: Commit formatting on maintenance branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Ruff formatting to source and tests'
            git push origin HEAD:chatgpt/codex-maintenance
          fi
