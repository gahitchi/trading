name: One-time Ruff format for daily scorecard
on:
  push:
    branches:
      - chatgpt/codex-maintenance
    paths:
      - .github/workflows/format-daily-scorecard-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format scorecard module tests and its CLI only
        run: |
          uvx ruff format src/lab/daily_scorecard.py tests/test_daily_scorecard.py src/lab/cli.py
          uvx ruff check src/lab/daily_scorecard.py tests/test_daily_scorecard.py src/lab/cli.py
          git diff --check
      - name: Commit only scorecard formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lab/daily_scorecard.py tests/test_daily_scorecard.py src/lab/cli.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format read-only daily performance scorecard'
            git fetch origin chatgpt/codex-maintenance
            git rebase origin/chatgpt/codex-maintenance
            git push origin HEAD:chatgpt/codex-maintenance
          fi
