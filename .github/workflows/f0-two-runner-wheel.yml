name: f0-two-runner-wheel

on:
  push:
    branches:
      - main
      - "chatgpt/f0-*"
  pull_request:

permissions:
  contents: read

jobs:
  independent-wheel:
    # Different ephemeral OS runners; this is NOT independent-provider trust.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          uv-version: "0.13.6"
          python-version: "3.13"
      - name: Resolve exact frozen build dependencies
        run: uv sync --frozen --group build
      - name: Build wheel separately from the identical source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          mkdir -p "$RUNNER_TEMP/f0-wheel"
          uv build --wheel --no-build-isolation --out-dir "$RUNNER_TEMP/f0-wheel"
          ( cd "$RUNNER_TEMP/f0-wheel" && sha256sum ./*.whl > sha256.txt )
          git rev-parse HEAD > "$RUNNER_TEMP/f0-wheel/source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f0-wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/f0-wheel/
          retention-days: 30
          if-no-files-found: error

  cross-runner-verification:
    needs: independent-wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download separate build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f0-wheel-ubuntu-22.04
          path: ${{ runner.temp }}/f0-independent/ubuntu-22.04/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f0-wheel-ubuntu-24.04
          path: ${{ runner.temp }}/f0-independent/ubuntu-24.04/
      - name: Verify exact source SHA and cross-runner wheel byte identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for host in ubuntu-22.04 ubuntu-24.04; do
            test "$(cat "$RUNNER_TEMP/f0-independent/$host/source-commit.txt")" = "$GITHUB_SHA"
            ( cd "$RUNNER_TEMP/f0-independent/$host" && sha256sum -c sha256.txt )
          done
          mkdir -p "$RUNNER_TEMP/f0-independent/verified"
          python3 -m tools.foundation_wheel \
            --first "$RUNNER_TEMP"/f0-independent/ubuntu-22.04/*.whl \
            --second "$RUNNER_TEMP"/f0-independent/ubuntu-24.04/*.whl \
            capture --out "$RUNNER_TEMP/f0-independent/verified/cross-runner.json"
          python3 -m tools.foundation_wheel \
            --first "$RUNNER_TEMP"/f0-independent/ubuntu-22.04/*.whl \
            --second "$RUNNER_TEMP"/f0-independent/ubuntu-24.04/*.whl \
            verify --input "$RUNNER_TEMP/f0-independent/verified/cross-runner.json"
          # Cross-runner equality receipt is unsigned; verified wheel is attested separately.
      - name: Sign verified wheel provenance for public push candidates
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/f0-independent/ubuntu-24.04/*.whl
      - name: Verify signed wheel provenance against exact source and workflow
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "$RUNNER_TEMP"/f0-independent/ubuntu-24.04/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/f0-two-runner-wheel.yml" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f0-two-runner-verification
          path: ${{ runner.temp }}/f0-independent/verified/
          retention-days: 30
          if-no-files-found: error
