name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -n auto

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group build
      - name: verify exported dependency graphs match the frozen lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file requirements-build.lock
          git diff --exit-code -- requirements.lock requirements-build.lock
      - name: build source and wheel without unpinned build isolation
        run: uv build --no-build-isolation
      - name: verify the wheel includes the dashboard assets
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('*.whl'))
          with ZipFile(wheel) as z:
              for name in ['lab/monitor_ui/index.html', 'lab/monitor_ui/monitor.js', 'lab/monitor_ui/monitor.css']:
                  assert z.read(name), name
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime image
        run: docker build -t trading-lab:ci .
      - name: smoke-test the image (no network needed)
        run: |
          docker run --rm trading-lab:ci --help
          docker run --rm trading-lab:ci record --check-only
          docker run --rm trading-lab:ci fast paper BTCUSDT --check-only
      - name: validate the compose file
        run: docker compose config -q
