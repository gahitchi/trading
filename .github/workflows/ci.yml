name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  collab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all branches: messages are read from every agent's own branch
          # Pull-request workflows otherwise check out GitHub's temporary merge commit,
          # which is not authored by an agent and therefore has no Agent trailer.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: message format and thread structure
        run: python3 tools/collab.py check
      - name: immutability, branch ownership, commit signatures
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 tools/collab.py check --base ${{ github.event.before }}
      - name: immutability, branch ownership, commit signatures (pull request)
        if: github.event_name == 'pull_request'
        run: python3 tools/collab.py check --base origin/${{ github.base_ref }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests tools
      - run: uvx ruff format --check src tests tools

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_collab reads conversation openers from other branches
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - name: fast tier, in parallel
        run: uv run --no-sync pytest -m "not llm and not harness" -n auto
      - name: real-clock LiveNode harness, serially
        run: uv run --no-sync pytest -m "harness"
      - name: offline example on real prices
        working-directory: examples/goog-offline
        run: |
          uv run --no-sync lab data sample
          uv run --no-sync lab backtest
          uv run --no-sync lab null-test sma_trend --samples 10

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group build
      - name: verify exported dependency graphs match the frozen lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --output-file requirements-build.lock
          git diff --exit-code -- requirements.lock requirements-build.lock
      - name: build source and wheel without unpinned build isolation
        run: uv build --no-build-isolation
      - name: verify the installed app includes setup and browser assets
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('*.whl'))
          with ZipFile(wheel) as z:
              for name in ['lab/default.toml', 'lab/ui/index.html', 'lab/ui/app.js', 'lab/ui/app.css']:
                  assert z.read(name), name
          PY

      - name: enforce F0–F8 architecture and evidence dependencies
        run: python3 tools/foundation_contracts.py check
      - name: F0 candidate source inventory (unqualified, read-only)
        run: |
          mkdir -p "$RUNNER_TEMP/f0-candidate"
          python3 tools/foundation_manifest.py create --out "$RUNNER_TEMP/f0-candidate/source.json"
          python3 tools/foundation_manifest.py verify --input "$RUNNER_TEMP/f0-candidate/source.json"
          sha256sum dist/*.whl > "$RUNNER_TEMP/f0-candidate/wheel.sha256"
      - name: retain F0 unsigned source and wheel identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: f0-inventory-py313
          path: ${{ runner.temp }}/f0-candidate/
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime image
        run: docker build -t trading-lab:ci .
      - name: F0 record image layers and installed OS/Python packages, without broker access
        run: |
          mkdir -p "$RUNNER_TEMP/f0-container"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          image = "trading-lab:ci"
          def inspect(field):
              return subprocess.check_output(
                  ["docker", "image", "inspect", "--format", field, image], text=True
              ).strip()
          record = {
              "id": inspect("{{.Id}}"),
              "os": inspect("{{.Os}}"),
              "architecture": inspect("{{.Architecture}}"),
              "user": inspect("{{.Config.User}}"),
              "rootfs_layers": json.loads(inspect("{{json .RootFS.Layers}}")),
          }
          file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "f0-container" / "image.json"
          file.write_text(json.dumps(record, sort_keys=True) + "\n")
          PY
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python trading-lab:ci -c '
          import hashlib, importlib.metadata, json, pathlib, subprocess
          saved = pathlib.Path("/usr/local/share/trading-lab-os-packages.txt").read_bytes()
          actual = subprocess.check_output(["dpkg-query", "-W"])
          if saved != actual:
              raise SystemExit("F0 OS package snapshot does not match container runtime")
          dist = sorted(
              (d.metadata["Name"].lower(), d.version)
              for d in importlib.metadata.distributions() if d.metadata.get("Name")
          )
          encoded = json.dumps(dist, separators=(",", ":"), sort_keys=True).encode()
          print(json.dumps({
              "os_inventory_sha256": hashlib.sha256(actual).hexdigest(),
              "installed_python_sha256": hashlib.sha256(encoded).hexdigest(),
              "installed_python_count": len(dist),
              "nautilus_version": importlib.metadata.version("nautilus_trader"),
              "lab_version": importlib.metadata.version("trading-lab"),
          }, sort_keys=True))
          ' > "$RUNNER_TEMP/f0-container/installed.json"
          python3 -m tools.foundation_image \
            --image "$RUNNER_TEMP/f0-container/image.json" \
            --installed "$RUNNER_TEMP/f0-container/installed.json" \
            capture --out "$RUNNER_TEMP/f0-container/receipt.json"
          python3 -m tools.foundation_image \
            --image "$RUNNER_TEMP/f0-container/image.json" \
            --installed "$RUNNER_TEMP/f0-container/installed.json" \
            verify --input "$RUNNER_TEMP/f0-container/receipt.json"
      - name: retain unsigned F0 container-build observation
        uses: actions/upload-artifact@v4
        with:
          name: f0-container-image
          path: ${{ runner.temp }}/f0-container/
          retention-days: 30
      - name: smoke-test the image (no broker needed)
        run: |
          docker run --rm trading-lab:ci --help
          docker run --rm -e LAB_PAPER_ACCOUNT=DU1234567 -e LAB_IB_PORT=4004 trading-lab:ci paper --check-only
      - name: generated-signal boundary in the unprivileged runtime
        run: |
          docker run --rm -i --entrypoint python trading-lab:ci - <<'PY'
          from lab.research.isolation import IsolatedSignal
          source = "from lab.signals.base import Signal\nclass Probe(Signal):\n    name = 'probe'\n    lookback = 1\n    def target(self, w):\n        return 0.0\n"
          signal = IsolatedSignal(source)
          assert signal.name == "probe"
          signal.close()
          PY
      - name: validate the compose file
        run: |
          mkdir -p secrets && echo x > secrets/tws_password
          TWS_USERID=ci LAB_PAPER_ACCOUNT=DU1234567 docker compose config -q
          TWS_USERID=ci LAB_PAPER_ACCOUNT=DU1234567 docker compose -f compose.app.yml config -q
      - name: guided app starts without enabling an engine or requiring broker data
        run: |
          docker run -d --name app-ci -p 127.0.0.1:8765:8765 trading-lab:ci app --directory /lab/results/app-ci --host 0.0.0.0 --no-browser
          python3 - <<'PY'
          import json, re, time, urllib.request
          for attempt in range(30):
              try:
                  page = urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2).read().decode()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise AssertionError('app did not start')
          token = re.search('name="app-token" content="([a-f0-9]+)"', page)[1]
          req = urllib.request.Request('http://127.0.0.1:8765/api/status', headers={'X-App-Token': token})
          state = json.load(urllib.request.urlopen(req, timeout=2))
          assert state['phase'] == 'setup' and not state['engine_alive'] and state['authority'] is None
          assert urllib.request.urlopen('http://127.0.0.1:8765/app.js').read()
          PY
          docker stop -t 30 app-ci
