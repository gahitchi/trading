name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest
      - name: offline example on real prices
        working-directory: examples/goog-offline
        run: |
          uv run --no-sync lab data sample
          uv run --no-sync lab backtest
          uv run --no-sync lab analyze --tickers GOOG --as-of 2010-12-30 --lookback 252 --json > analysis.json
          uv run --no-sync python -c 'import json; r=json.load(open("analysis.json")); assert r["qualification"] == "EXPLORATORY_ONLY" and len(r["analysis_id"]) == 64'
          uv run --no-sync lab capital-audit --manifest ../multiasset-offline/portfolio.json --json > capital.json
          uv run --no-sync python -c 'import json; x=json.load(open("capital.json")); assert x["qualification"] == "RESEARCH_ONLY_NOT_FOR_TRADING" and x["stress_before"]["risk_status"] == "LIMIT_BREACH_IN_ASSUMED_SCENARIOS"'
          uv run --no-sync lab forecast --ticker GOOG --as-of 2010-12-30 --min-train 252 --calibration 60 --test-sessions 60 --json > forecast.json
          uv run --no-sync python -c 'import json; r=json.load(open("forecast.json")); assert r["qualification"] == "RESEARCH_ONLY_NOT_FOR_TRADING" and r["frozen_oos_test"]["test_count"] == 60'
          uv run --no-sync lab null-test sma_trend --samples 2 --workers 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime image
        run: docker build -t trading-lab:ci .
      - name: smoke-test the image (no broker needed)
        run: |
          docker run --rm trading-lab:ci --help
          docker run --rm -e LAB_PAPER_ACCOUNT=DU1234567 -e LAB_IB_PORT=4004 trading-lab:ci paper --check-only
      - name: validate the compose file
        run: |
          mkdir -p secrets && echo x > secrets/tws_password
          TWS_USERID=ci LAB_PAPER_ACCOUNT=DU1234567 docker compose config -q
