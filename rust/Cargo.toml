[workspace]
members = ["crates/core-types", "crates/orderbook", "crates/signals", "crates/wallet-manager", "crates/strategy-engine", "crates/risk-gate", "crates/paper-gateway"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Central catalog for Parts 1-6. A dependency becomes a build input only when
# declared in an individual crate's Cargo.toml.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
crossbeam-channel = "0.5"
core_affinity = "0.8"
ed25519-dalek = "2"
simd-json = "0.18"
itoa = "1"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
